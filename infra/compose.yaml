# The whole system from one file, for local development now and staging later (AD-16).
#
#   cp infra/.env.template infra/.env     # then fill in the secrets
#   docker compose -f infra/compose.yaml up -d --build
#   open http://localhost:8080
#
# See docs/local-environment.md. Image references are variables so a mirror can
# be set in infra/.env; the defaults are the canonical images.
name: shop

x-s3-env: &s3-env
  S3_ENDPOINT: http://floci:4566
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in infra/.env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in infra/.env}

x-commerce-build: &commerce-build
  context: ..
  dockerfile: apps/commerce/Dockerfile
  additional_contexts:
    certs: ${BUILD_CA_DIR:-./certs}
  args:
    NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8}
    # Event bus, workflow engine and locking only: never evict, always persist.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  floci:
    image: ${FLOCI_IMAGE:-floci/floci:2.5.0}
    environment:
      FLOCI_STORAGE_MODE: persistent
    volumes:
      - floci-data:/app/data
    ports:
      # Published for host tools; browsers fetch public files through Caddy (/catalog).
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates the public, versioned `catalog` bucket, then exits.
  # Runs the commerce image (built by the commerce service) for its S3 client.
  bucket-init:
    image: ${COMMERCE_IMAGE:-shop/commerce:local}
    pull_policy: never
    working_dir: /repo/apps/commerce
    entrypoint: ["node", "/repo/infra/init/create-buckets.mjs"]
    environment:
      <<: *s3-env
      CATALOG_BUCKET: catalog
    depends_on:
      floci:
        condition: service_healthy
    restart: "no"

  commerce:
    image: ${COMMERCE_IMAGE:-shop/commerce:local}
    build: *commerce-build
    environment:
      <<: *s3-env
      NODE_ENV: production
      # Keeps the kernel's own HTTP log (client addresses, query strings) off;
      # commerce writes its own JSON access-log line per request.
      LOG_LEVEL: info
      MEDUSA_WORKER_MODE: shared
      DATABASE_URL: postgres://${POSTGRES_USER:-commerce}:${POSTGRES_PASSWORD}@postgres:5432/commerce?sslmode=disable
      REDIS_URL: redis://redis:6379
      STORE_CORS: ${PUBLIC_URL:-http://localhost:${CADDY_PORT:-8080}}
      ADMIN_CORS: ${PUBLIC_URL:-http://localhost:${CADDY_PORT:-8080}}
      AUTH_CORS: ${PUBLIC_URL:-http://localhost:${CADDY_PORT:-8080}}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in infra/.env}
      S3_BUCKET: catalog
      S3_FILE_URL: ${S3_FILE_URL:-${PUBLIC_URL:-http://localhost:${CADDY_PORT:-8080}}/catalog}
      PUBLISHABLE_KEY_FILE: /var/lib/shop/publishable-key
    volumes:
      - shared-config:/var/lib/shop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Covers a slow first start: every migration plus the initial data seed.
      start_period: 900s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      additional_contexts:
        certs: ${BUILD_CA_DIR:-./certs}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:${CADDY_PORT:-8080}}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PUBLIC_URL:-http://localhost:${CADDY_PORT:-8080}}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:${CADDY_PORT:-8080}}
      COMMERCE_INTERNAL_URL: http://commerce:9000
      NEXT_PUBLIC_STORE_NAME: ${STORE_NAME:-}
      # Empty: read from the file commerce writes at start.
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${PUBLISHABLE_KEY:-}
      PUBLISHABLE_KEY_FILE: /var/lib/shop/publishable-key
    volumes:
      - shared-config:/var/lib/shop:ro
    depends_on:
      commerce:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    ports:
      - "${CADDY_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      commerce:
        condition: service_healthy
      web:
        condition: service_healthy
      floci:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  floci-data:
  caddy-data:
  shared-config:
