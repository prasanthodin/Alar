name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The forbidden product name: read from the FORBIDDEN_NAME repository variable,
      # with a default in this CI workflow only; never in application or package code.
      FORBIDDEN_NAME: ${{ vars.FORBIDDEN_NAME || 'alar' }}
      MEDUSA_DISABLE_TELEMETRY: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      # Throwaway values for the CI database and kernel only.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/commerce
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
      # The kernel's event bus, workflow engine and locking run on Redis (Story 1.3).
      REDIS_URL: redis://localhost:6379
      # File storage settings the kernel checks at start; nothing uploads in CI,
      # so no emulator runs here (scripts/compose-smoke.sh covers file storage).
      S3_ENDPOINT: http://localhost:4566
      S3_BUCKET: catalog
      S3_REGION: us-east-1
      S3_FILE_URL: http://localhost:4566/catalog
      S3_ACCESS_KEY_ID: ci-only
      S3_SECRET_ACCESS_KEY: ci-only
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        run: corepack enable

      # The compose file must stay valid with the committed template; the secrets
      # the template leaves empty come from throwaway values here.
      - name: Compose file check
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
        run: docker compose -f infra/compose.yaml --env-file infra/.env.template config -q

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Name check
        run: node scripts/check-forbidden-name.mjs

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The website's build does not need the kernel, but the end-to-end test
      # after it does: migrate (the starter's initial data seed runs as a
      # migration script), start the kernel and read the seeded publishable key,
      # which the build checks for and the running website uses. See docs/starter.md.
      - name: Migrate and seed the kernel database
        working-directory: apps/commerce
        run: pnpm exec medusa db:migrate

      - name: Start the kernel
        working-directory: apps/commerce
        run: |
          nohup pnpm dev > "$RUNNER_TEMP/commerce.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "Kernel is healthy"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/commerce.log"
          exit 1

      - name: Request log has one JSON line per request with the request id
        run: |
          id=3b241101-e2bb-4255-8caf-4136c566a962
          curl -sfD - -o /dev/null -H "X-Request-Id: $id" http://localhost:9000/health | tee "$RUNNER_TEMP/health-headers"
          grep -qi "^x-request-id: $id" "$RUNNER_TEMP/health-headers"
          sleep 1
          test "$(grep -cF "\"requestId\":\"$id\"" "$RUNNER_TEMP/commerce.log")" = "1"

      - name: Redis modules work (event, workflow, lock)
        working-directory: apps/commerce
        run: pnpm exec medusa exec ./src/scripts/spike-redis.ts

      - name: Kernel refuses to start with a missing variable
        working-directory: apps/commerce
        run: |
          if env -u S3_BUCKET pnpm exec medusa db:migrate > "$RUNNER_TEMP/env-check.log" 2>&1; then
            echo "db:migrate succeeded without S3_BUCKET"; exit 1
          fi
          grep -q "Missing or invalid environment variable: S3_BUCKET" "$RUNNER_TEMP/env-check.log"

      - name: Read the seeded publishable key
        run: |
          key=$(psql "$DATABASE_URL" -At -c "select token from api_key where type = 'publishable' and revoked_at is null and deleted_at is null order by created_at limit 1")
          test -n "$key"
          echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Start the website
        run: |
          nohup pnpm --filter @shop/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "Website is up"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/web.log"
          exit 1

      - name: Install Playwright's Chromium
        run: pnpm --filter @shop/web exec playwright install --with-deps chromium

      - name: End-to-end test
        env:
          E2E_BASE_URL: http://localhost:8000
        run: pnpm --filter @shop/web run e2e

      - name: Kernel and website logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/commerce.log" || true
          cat "$RUNNER_TEMP/web.log" || true
